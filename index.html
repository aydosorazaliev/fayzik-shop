 if($('sort').value==='low')list.sort((a,b)=>a.price-b.price);if($('sort').value==='high')list.sort((a,b)=>b.price-a.price);
 $('count').textContent=list.length+t('cnt');
 $('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="visual">${visual(p)}<span class="ribbon ${p.sold?'sold':''}">${t(p.sold?'soldOut':'sale')}</span><button class="fav" data-fav="${p.id}">${favs.includes(p.id)?'♥':'♡'}</button><span class="level">LVL ${p.level}</span></div><div class="cardbody"><h3>${esc(tx(p,'name'))}</h3><div class="price">${money(p.price)}</div><div class="meta"><span>✦ ${p.skins} ${t('skin')}</span><span>• ${t('g_'+p.group)}</span></div><div class="buttons"><button class="btn" data-detail="${p.id}">${t('details')}</button><button class="btn primary" data-add="${p.id}" ${p.sold?'disabled':''}>${t('add')}</button></div></div></article>`).join(''):`<div class="empty">${t('none')}</div>`;
 $('grid').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(+b.dataset.detail));
 $('grid').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(+b.dataset.add));
 $('grid').querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggleFav(+b.dataset.fav))}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];store('fayzik_favs',JSON.stringify(favs));buzz();render()}
function add(id){let p=data.find(x=>x.id===id);if(!p||p.sold)return;cartItems[id]=(cartItems[id]||0)+1;updateCart();buzz()}
function updateCart(){$('cartCount').textContent=Object.values(cartItems).reduce((a,b)=>a+b,0)}
function showDetail(id){let p=data.find(x=>x.id===id);if(!p)return;detailId=id;
 $('detail').innerHTML=`<div class="detailart">${visual(p)}</div><div class="detailprice">${money(p.price)}</div><h2>${esc(tx(p,'name'))}</h2><div class="facts"><div class="fact"><b>${p.level}</b><small>${t('lvl')}</small></div><div class="fact"><b>${p.skins}</b><small>Skin</small></div><div class="fact"><b>${t('g_'+p.group)}</b><small>${t('grp')}</small></div></div><p class="desc">${esc(tx(p,'desc'))}</p><p class="desc">${t('dNote')}</p><button class="wide" id="detailAdd" ${p.sold?'disabled style="opacity:.45"':''}>${t(p.sold?'soldOut':'dAdd')}</button>`;
 $('detailModal').classList.add('show');$('detailAdd').onclick=()=>{if(p.sold)return;add(id);close('detailModal')}}
function renderCart(){
 let rows=Object.entries(cartItems).filter(([id,n])=>n>0).map(([id,n])=>({p:data.find(p=>p.id===+id&&!p.sold),n})).filter(x=>x.p);
 if(!rows.length){$('cart').innerHTML=`<div class="empty">${t('empty')}</div>`;return}
 let total=rows.reduce((s,x)=>s+x.p.price*x.n,0);
 $('cart').innerHTML=rows.map(({p,n})=>`<div class="cartrow"><div><b>${esc(tx(p,'name'))}</b><small>${money(p.price)} × ${n}</small></div><div class="qty"><button data-dec="${p.id}">−</button><b>${n}</b><button data-inc="${p.id}">+</button></div></div>`).join('')+`<div class="total"><span>${t('total')}</span><span>${money(total)}</span></div><label class="field"><span>${t('nm')}</span><input id="buyerName" placeholder="${t('nmP')}"></label><label class="field"><span>${t('us')}</span><input id="buyerUser" placeholder="@username"></label><div class="manual"><b>${t('payB')}</b><br>${t('payT')}</div><button class="wide" id="sendOrder">${t('send')}</button>`;
 $('cart').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{let id=b.dataset.dec;cartItems[id]--;if(cartItems[id]<=0)delete cartItems[id];updateCart();renderCart()});
 $('cart').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cartItems[b.dataset.inc]++;updateCart();renderCart()});
 $('sendOrder').onclick=()=>{let name=$('buyerName').value.trim(),user=$('buyerUser').value.trim(),lines=rows.map(x=>`- ${tx(x.p,'name')} x${x.n}: ${money(x.p.price*x.n)}`).join('\n');openAdmin(`${t('o1')}\n${lines}\n${t('o2')}: ${money(total)}\n${t('o3')}: ${name||t('na')}\n${t('o4')}: ${user||t('na')}\n${t('o5')}`)}}
function close(id){$(id).classList.remove('show')}
/* ---------- ADMIN PANEL (o'zbekcha) ---------- */
let token=''; try{token=sessionStorage.getItem('fz_tok')||''}catch(e){}
async function api(path,method,body){let r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined}),j={};try{j=await r.json()}catch(e){}if(!r.ok){let er=new Error(j.error||('Xato '+r.status));er.status=r.status;throw er}return j}
function setMsg(s){let m=$('aMsg');if(m)m.textContent=s||''}
function openPanel(){$('adminModal').classList.add('show');token?adminList():adminLogin()}
function adminLogin(msg){$('adminBody').innerHTML=`<label class="field"><span>Parol</span><input id="aPass" type="password" autocomplete="current-password"></label><div class="msg" id="aMsg">${esc(msg||'')}</div><button class="wide" id="aLogin">Kirish</button>`;
 let go=async()=>{setMsg('...');try{let j=await api('/api/login','POST',{password:$('aPass').value});token=j.token;try{sessionStorage.setItem('fz_tok',token)}catch(e){}adminList()}catch(e){setMsg(e.message)}};
 $('aLogin').onclick=go;$('aPass').onkeydown=e=>{if(e.key==='Enter')go()}}
async function saveAll(list,ok){setMsg('Saqlanmoqda...');try{let j=await api('/api/products','PUT',{products:list});data=j.products;render();adminList(ok||'✅ Saqlandi')}catch(e){if(e.status===401){token='';try{sessionStorage.removeItem('fz_tok')}catch(x){}adminLogin('Seans tugadi, qayta kiring')}else setMsg('❌ '+e.message)}}
function adminList(msg){
 $('adminBody').innerHTML=`<div class="msg" id="aMsg">${esc(msg||'')}</div><button class="wide" id="aNew" style="margin-top:0">+ Yangi akkaunt</button>`+data.map(p=>`<div class="arow"><div><b>${esc(p.emoji)} ${esc(p.name_uz)}</b><small>${money(p.price)} · LVL ${p.level} · ${p.sold?'SOTILGAN':'sotuvda'}</small></div><div class="acts"><button class="sm" data-sold="${p.id}">${p.sold?'↩ Sotuvga':'✓ Sotildi'}</button><button class="sm" data-edit="${p.id}">✎</button><button class="sm red" data-del="${p.id}">🗑</button></div></div>`).join('')+`<div class="two" style="margin-top:14px"><button class="sm" id="aExp">⬇ Eksport (zaxira)</button><button class="sm" id="aImp">⬆ Import</button></div><input type="file" id="aFile" accept=".json" hidden><button class="sm" id="aOut" style="margin-top:10px;width:100%">Chiqish</button>`;
 $('aNew').onclick=()=>adminForm();
 $('adminBody').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>adminForm(data.find(p=>p.id===+b.dataset.edit)));
 $('adminBody').querySelectorAll('[data-sold]').forEach(b=>b.onclick=()=>saveAll(data.map(p=>p.id===+b.dataset.sold?{...p,sold:!p.sold}:p)));
 $('adminBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('O‘chirilsinmi?'))saveAll(data.filter(p=>p.id!==+b.dataset.del),'🗑 O‘chirildi')});
 $('aExp').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='fayzik-products.json';a.click()};
 $('aImp').onclick=()=>$('aFile').click();
 $('aFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let l=JSON.parse(await f.text());if(!Array.isArray(l))throw 0;if(confirm(l.length+' ta akkaunt import qilinadi, hozirgilari almashtiriladi. Davom etasizmi?'))saveAll(l,'✅ Import qilindi')}catch(x){setMsg('❌ Fayl noto‘g‘ri')}};
 $('aOut').onclick=()=>{token='';try{sessionStorage.removeItem('fz_tok')}catch(e){}close('adminModal')}}
function adminForm(p){let n=!p;p=p||{name_uz:'',name_ru:'',desc_uz:'',desc_ru:'',price:'',level:'',skins:'',group:'cheap',emoji:'🎮',img:'',sold:false};
 let f=(id,l,v,ty)=>`<label class="field"><span>${l}</span><input id="${id}" ${ty||''} value="${esc(v)}"></label>`;
 $('adminBody').innerHTML=`<div class="msg" id="aMsg"></div>${f('fNu','Nomi (O‘zbekcha)',p.name_uz)}${f('fNr','Nomi (Русский)',p.name_ru)}<label class="field"><span>Tavsif (O‘zbekcha)</span><textarea id="fDu">${esc(p.desc_uz)}</textarea></label><label class="field"><span>Tavsif (Русский)</span><textarea id="fDr">${esc(p.desc_ru)}</textarea></label><div class="two">${f('fP','Narx (so‘m)',p.price,'type="number" min="0" inputmode="numeric"')}${f('fL','Level',p.level,'type="number" min="0"')}</div><div class="two">${f('fS','Skin soni',p.skins,'type="number" min="0"')}<label class="field"><span>Toifa</span><select id="fG">${[['cheap','Arzon'],['mid','O‘rtacha'],['premium','Qimmat']].map(([v,l])=>`<option value="${v}" ${p.group===v?'selected':''}>${l}</option>`).join('')}</select></label></div>${f('fE','Emoji',p.emoji)}${f('fI','Rasm havolasi (https://..., ixtiyoriy)',p.img)}<label class="field"><span><input type="checkbox" id="fSold" ${p.sold?'checked':''} style="width:auto;height:auto"> Sotilgan</span></label><button class="wide" id="fSave">💾 Saqlash</button><button class="sm" id="fBack" style="margin-top:10px;width:100%">← Orqaga</button>`;
 $('fBack').onclick=()=>adminList();
 $('fSave').onclick=()=>{let o={...p,name_uz:$('fNu').value,name_ru:$('fNr').value,desc_uz:$('fDu').value,desc_ru:$('fDr').value,price:$('fP').value,level:$('fL').value,skins:$('fS').value,group:$('fG').value,emoji:$('fE').value,img:$('fI').value.trim(),sold:$('fSold').checked};
  if(!o.name_uz.trim()&&!o.name_ru.trim()){setMsg('Nomini kiriting');return}
  if(o.img&&!o.img.startsWith('https://')){setMsg('Rasm havolasi https:// bilan boshlanishi kerak');return}
  if(n)delete o.id;saveAll(n?[...data,o]:data.map(x=>x.id===p.id?o:x))}}
/* ---------- init ---------- */
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));
['detailModal','cartModal','helpModal','adminModal'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.id===id)close(id)}));
$('cartBtn').onclick=()=>{renderCart();$('cartModal').classList.add('show')};
$('adminBtn').onclick=()=>openAdmin();$('helpBtn').onclick=()=>$('helpModal').classList.add('show');$('helpContact').onclick=()=>openAdmin();
$('langBtn').onclick=()=>{lang=lang==='uz'?'ru':'uz';store('fz_lang',lang);applyLang()};
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);
let taps=0,tapT;$('logo').onclick=()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;openPanel()}};
const hashCheck=()=>{if(location.hash==='#admin')openPanel()};window.addEventListener('hashchange',hashCheck);
$('themeBtn').onclick=()=>{document.body.classList.toggle('light');let light=document.body.classList.contains('light'),s=document.documentElement.style;s.setProperty('--bg',light?'#f1f4fa':'#090d18');s.setProperty('--panel',light?'#fff':'#111a2b');s.setProperty('--panel2',light?'#e9eef6':'#17243a');s.setProperty('--line',light?'#d8e0ed':'#283750');s.setProperty('--txt',light?'#17213a':'#f3f7ff');s.setProperty('--muted',light?'#64728b':'#94a4bf')};
$('year').textContent=new Date().getFullYear();
if(tg&&tg.BackButton){tg.BackButton.onClick(()=>{for(let id of ['adminModal','cartModal','detailModal','helpModal'])if($(id).classList.contains('show')){close(id);return}tg.close()})}
applyLang();
fetch('/api/products',{cache:'no-store'}).then(r=>r.json()).then(j=>{data=j.products||[];loaded=true;render();hashCheck()}).catch(()=>{failed=true;render()});
})();
</script>
